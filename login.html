<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR-Manager | כניסה</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6fed">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card" id="loginCard">
    <h1>ניהול כוח אדם</h1>
    <p class="muted" style="text-align:center">כניסה למערכת</p>
    <div class="field">
      <label>אימייל</label>
      <input type="email" id="email" autocomplete="username">
    </div>
    <div class="field">
      <label>סיסמה</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="loginBtn" style="width:100%">כניסה</button>
    <div class="error-msg" id="errorMsg"></div>
    <p style="text-align:center;margin-top:10px">
      <a href="#" id="forgotPasswordLink" style="font-size:13px">שכחתי סיסמה</a>
    </p>
  </div>

  <div class="card login-card" id="mfaChallengeCard" style="display:none">
    <h1>אימות דו-שלבי</h1>
    <p class="muted" style="text-align:center">הוזן קוד שנשלח ב-SMS למספר המשויך לחשבון</p>
    <div class="field">
      <label>קוד אימות</label>
      <input id="mfaCodeInput" inputmode="numeric" maxlength="6">
    </div>
    <button class="btn primary" id="mfaVerifyBtn" style="width:100%">אימות</button>
    <div class="error-msg" id="mfaErrorMsg"></div>
  </div>

  <div id="recaptcha-container-login"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/auth-common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const errorMsg = document.getElementById('errorMsg');
if (params.get('denied') === '1') errorMsg.textContent = 'למשתמש זה אין הרשאת גישה למערכת.';

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { errorMsg.textContent = 'נא להזין אימייל ולאחר מכן ללחוץ על "שכחתי סיסמה".'; return; }
  try {
    await auth.sendPasswordResetEmail(email);
    errorMsg.style.color = 'var(--success)';
    errorMsg.textContent = 'נשלח אימייל לאיפוס סיסמה.';
  } catch (e2) {
    errorMsg.style.color = '';
    errorMsg.textContent = 'שגיאה בשליחת האימייל: ' + e2.message;
  }
});

async function doLogin() {
  errorMsg.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { errorMsg.textContent = 'נא למלא אימייל וסיסמה'; return; }
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    await proceedAfterAuth(cred.user);
  } catch (e) {
    if (e.code === 'auth/multi-factor-auth-required') {
      await startMfaChallenge(e);
      return;
    }
    errorMsg.textContent = 'אימייל או סיסמה שגויים.';
  }
}

async function proceedAfterAuth(user) {
  const info = await resolveCurrentUserRole(user);
  if (!info) {
    await auth.signOut();
    errorMsg.textContent = 'למשתמש זה אין הרשאת גישה למערכת.';
    return;
  }
  window.location.href = info.role === 'employee' ? 'portal.html' : 'admin.html';
}

let mfaResolver = null;
let mfaChallengeVerificationId = null;

async function startMfaChallenge(error) {
  mfaResolver = error.resolver;
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('mfaChallengeCard').style.display = 'block';
  const mfaErrorMsg = document.getElementById('mfaErrorMsg');
  try {
    const recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container-login', { size: 'invisible' }, auth);
    const phoneAuthProvider = new firebase.auth.PhoneAuthProvider(auth);
    mfaChallengeVerificationId = await phoneAuthProvider.verifyPhoneNumber(
      { multiFactorHint: mfaResolver.hints[0], session: mfaResolver.session }, recaptchaVerifier
    );
  } catch (e2) {
    mfaErrorMsg.textContent = 'שגיאה בשליחת קוד האימות: ' + e2.message;
  }
}

document.getElementById('mfaVerifyBtn').addEventListener('click', async () => {
  const mfaErrorMsg = document.getElementById('mfaErrorMsg');
  const code = document.getElementById('mfaCodeInput').value.trim();
  if (!code || !mfaChallengeVerificationId) return;
  try {
    const cred = firebase.auth.PhoneAuthProvider.credential(mfaChallengeVerificationId, code);
    const assertion = firebase.auth.PhoneMultiFactorGenerator.assertion(cred);
    const userCredential = await mfaResolver.resolveSignIn(assertion);
    await proceedAfterAuth(userCredential.user);
  } catch (e) {
    mfaErrorMsg.textContent = 'קוד שגוי.';
  }
});
document.getElementById('mfaCodeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('mfaVerifyBtn').click();
});

// If already signed in, skip straight past the login form.
auth.onAuthStateChanged(async (user) => {
  if (!user) return;
  const info = await resolveCurrentUserRole(user);
  if (!info) return;
  window.location.href = info.role === 'employee' ? 'portal.html' : 'admin.html';
});
</script>
</body>
</html>
