<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR-Manager | כניסה</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1>ניהול כוח אדם</h1>
    <p class="muted" style="text-align:center">כניסה למערכת</p>
    <div class="field">
      <label>אימייל</label>
      <input type="email" id="email" autocomplete="username">
    </div>
    <div class="field">
      <label>סיסמה</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="loginBtn" style="width:100%">כניסה</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/auth-common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const errorMsg = document.getElementById('errorMsg');
if (params.get('denied') === '1') errorMsg.textContent = 'למשתמש זה אין הרשאת גישה למערכת.';

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  errorMsg.textContent = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { errorMsg.textContent = 'נא למלא אימייל וסיסמה'; return; }
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const info = await resolveCurrentUserRole(cred.user);
    if (!info) {
      await auth.signOut();
      errorMsg.textContent = 'למשתמש זה אין הרשאת גישה למערכת.';
      return;
    }
    if (info.role === 'employee') {
      window.location.href = 'portal.html';
    } else {
      window.location.href = 'admin.html';
    }
  } catch (e) {
    errorMsg.textContent = 'אימייל או סיסמה שגויים.';
  }
}

// If already signed in, skip straight past the login form.
auth.onAuthStateChanged(async (user) => {
  if (!user) return;
  const info = await resolveCurrentUserRole(user);
  if (!info) return;
  window.location.href = info.role === 'employee' ? 'portal.html' : 'admin.html';
});
</script>
</body>
</html>
